<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img" aria-label="Eduardo Monteiro Dev Logo">
  <defs>
    <linearGradient id="gm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B5CF0"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>
    <filter id="gf">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Hexagonal mark -->
  <polygon points="30,4 50,15 50,37 30,48 10,37 10,15"
    fill="none" stroke="url(#gm)" stroke-width="1.5" filter="url(#gf)"/>
  <!-- Neural nodes -->
  <circle cx="30" cy="4"  r="2" fill="#7B5CF0" opacity="0.9"/>
  <circle cx="50" cy="15" r="2" fill="#7B5CF0" opacity="0.7"/>
  <circle cx="50" cy="37" r="2" fill="#00F5A0" opacity="0.9"/>
  <circle cx="30" cy="48" r="2" fill="#00F5A0" opacity="0.7"/>
  <circle cx="10" cy="37" r="2" fill="#00F5A0" opacity="0.9"/>
  <circle cx="10" cy="15" r="2" fill="#7B5CF0" opacity="0.7"/>
  <circle cx="30" cy="26" r="2.5" fill="url(#gm)"/>
  <!-- Internal connections -->
  <line x1="30" y1="4"  x2="30" y2="26" stroke="url(#gm)" stroke-width="0.8" opacity="0.5"/>
  <line x1="10" y1="15" x2="30" y2="26" stroke="url(#gm)" stroke-width="0.8" opacity="0.5"/>
  <line x1="50" y1="37" x2="30" y2="26" stroke="url(#gm)" stroke-width="0.8" opacity="0.5"/>
  <line x1="30" y1="48" x2="30" y2="26" stroke="url(#gm)" stroke-width="0.8" opacity="0.5"/>
  <!-- EM monogram -->
  <text x="18" y="31" font-family="'Space Grotesk',sans-serif" font-weight="700"
    font-size="11" fill="url(#gm)" filter="url(#gf)">EM</text>
  <!-- Wordmark -->
  <text x="62" y="28" font-family="'Space Grotesk',sans-serif" font-weight="700"
    font-size="18" fill="#E8E8FF" letter-spacing="-0.5">Vibe</text>
  <text x="101" y="28" font-family="'Space Grotesk',sans-serif" font-weight="300"
    font-size="18" fill="url(#gm)" letter-spacing="-0.5">Coder</text>
  <text x="62" y="42" font-family="'JetBrains Mono',monospace" font-weight="400"
    font-size="7.5" fill="#7B5CF0" letter-spacing="1.5">EDUARDO MONTEIRO · DEV</text>
</svg>
