<style>
:root{--bg:#050508;--deep:#0A0A0F;--card:#0E0E16;--border:rgba(123,92,240,.2);--border-h:rgba(123,92,240,.45);--purple:#7B5CF0;--teal:#00F5A0;--coral:#FF3CAC;--text:#E8E8FF;--muted:#9090B0;--faint:#2A2A3A;--grad:linear-gradient(135deg,#7B5CF0,#00F5A0)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Georgia',serif;line-height:1.75;padding-bottom:80px;overflow-x:hidden}
a{color:var(--purple);text-decoration:none}
.blog-header{background:var(--deep);border-bottom:2px solid var(--purple);padding:14px 0;position:sticky;top:0;z-index:50}
.blog-header-inner{max-width:860px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bh-logo{font-family:monospace;font-size:.85rem;color:var(--teal);text-transform:uppercase;letter-spacing:.1em;flex:1}
.bh-back{font-family:monospace;font-size:.75rem;color:var(--muted);padding:4px 12px;border:1px solid var(--border);border-radius:6px;transition:all .2s}
.bh-back:hover{color:var(--purple);border-color:var(--purple)}
.bh-lang-wrap{position:relative}
.bh-lang-btn{font-family:monospace;font-size:.75rem;color:var(--muted);padding:4px 12px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:none;transition:all .2s;display:flex;align-items:center;gap:5px}
.bh-lang-btn:hover,.bh-lang-btn.open{color:var(--purple);border-color:var(--purple)}
.lang-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--border-h);border-radius:10px;padding:8px;min-width:140px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.6);flex-direction:column;gap:4px}
.lang-dropdown.open{display:flex}
.lang-opt{font-family:monospace;font-size:.75rem;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;border:none;background:none;text-align:left;transition:all .2s;width:100%}
.lang-opt:hover{color:var(--text);background:rgba(123,92,240,.08)}
.lang-opt.active{color:var(--purple);background:rgba(123,92,240,.12)}
.container{max-width:860px;margin:0 auto;padding:0 24px}
.blog-hero{padding:48px 0 36px}
.blog-eyebrow{font-family:monospace;font-size:.72rem;color:var(--purple);text-transform:uppercase;letter-spacing:.15em;margin-bottom:10px}
.blog-title{font-family:monospace;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;line-height:1.1;margin-bottom:14px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.blog-sub{font-size:1rem;color:var(--muted);max-width:560px;line-height:1.7}
.section-divider{height:1px;background:linear-gradient(90deg,transparent,var(--border-h),transparent);margin:32px 0}

.topics-grid{display:flex;flex-direction:column;gap:12px}
.topic-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px 24px;transition:border-color .2s;position:relative;overflow:hidden;cursor:default}
.topic-card:hover{border-color:var(--border-h)}
.topic-card.featured{border-color:rgba(0,245,160,.3);background:rgba(0,245,160,.02)}
.topic-n{font-family:monospace;font-size:.65rem;color:var(--faint);position:absolute;top:20px;right:20px;letter-spacing:.06em}
.topic-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.topic-tag{font-family:monospace;font-size:.6rem;padding:2px 8px;border-radius:4px;border:1px solid var(--border);color:var(--muted);letter-spacing:.06em}

footer{text-align:center;padding:2rem 1rem;border-top:1px solid var(--border);margin-top:4rem;font-size:.85rem;opacity:.8;font-family:system-ui,sans-serif}

@media(max-width:560px){.blog-hero{padding:32px 0 24px}.topic-card{padding:16px}.topic-title{font-size:.88rem}.lang-dropdown{right:auto;left:0}}

<script>
'use strict';
/* ─────────────────────────────────────────────────────────────────────────
 * blog.js — Reactive i18n engine for blog.html
 * Depends on i18n.js (loaded synchronously in <head>).
 * ─────────────────────────────────────────────────────────────────────── */

/* ── ARTICLE DATA ────────────────────────────────────────────────────────
 * Each article has:
 *   n        — display number ('#01')
 *   featured — boolean (teal border)
 *   tags     — tech tag chips (static, language-neutral technical terms)
 *   langTag  — editorial language label (e.g. 'PT · EN', 'DE-CH')
 *   langTagCls — 'lang' class applied when the tag denotes a native-language article
 *   readMin  — reading time integer
 *   titleKey — i18n key in blog section, OR titleStatic for non-i18n titles
 *   descKey  — i18n key in blog section, OR descStatic for non-i18n descs
 *
 * Articles #01, #02, #07–#10 are published in PT+EN → title/desc in i18n.
 * Articles #03 (DE-CH), #04 (FR-CH), #05 (IT-CH), #06 (EN) are intentionally
 * in their native editorial language — their titles/descs are language-fixed
 * static strings. The `langTag` badge makes this explicit to the reader.
 * ────────────────────────────────────────────────────────────────────── */
var ARTICLES = [
  {
    n:'#01', featured:true,
    tags:['Cost','Stripe','OpenAI','SaaS'],
    langTag:'PT · EN', langTagCls:'',
    readMin:8,
    titleKey:'art01Title', descKey:'art01Desc'
  },
  {
    n:'#02', featured:true,
    tags:['Firebase','PostgreSQL','Architecture','MVP'],
    langTag:'PT · EN', langTagCls:'',
    readMin:10,
    titleKey:'art02Title', descKey:'art02Desc'
  },
  {
    n:'#03', featured:false,
    tags:['FADP','Schweiz','Compliance'],
    langTag:'DE-CH', langTagCls:'lang',
    readMin:12,
    titleStatic:'nDSG / FADP für SaaS-Startups — Was Gründer 2024 wissen müssen',
    descStatic:'Praktischer Leitfaden zur revidierten Schweizer Datenschutzgesetzgebung (nDSG, in Kraft seit 1. Sept. 2023) für SaaS-Gründer: Pflichten des Verantwortlichen, Datenschutzerklärung, Privacy by Design und wann ein Datenschutzbeauftragter erforderlich ist.'
  },
  {
    n:'#04', featured:false,
    tags:['FADP','Suisse','Compliance'],
    langTag:'FR-CH', langTagCls:'lang',
    readMin:10,
    titleStatic:'nLPD / FADP pour les startups SaaS en Suisse — Guide pratique pour fondateurs',
    descStatic:"Guide opérationnel sur la nouvelle Loi fédérale sur la protection des données (nLPD) pour les entreprises SaaS basées ou ciblant la Suisse : obligations légales, politique de confidentialité, transferts transfrontaliers et différences avec le RGPD européen."
  },
  {
    n:'#05', featured:false,
    tags:['FADP','Svizzera','Compliance'],
    langTag:'IT-CH', langTagCls:'lang',
    readMin:10,
    titleStatic:'nLPD / FADP per le startup SaaS in Svizzera — Guida pratica per fondatori non tecnici',
    descStatic:"Guida operativa alla nuova Legge federale sulla protezione dei dati (nLPD) per SaaS che operano o si rivolgono al mercato svizzero: obblighi del titolare del trattamento, Privacy by Design e differenze rispetto al GDPR europeo."
  },
  {
    n:'#06', featured:false,
    tags:['FADP','GDPR','Compliance'],
    langTag:'EN', langTagCls:'lang',
    readMin:14,
    titleStatic:'FADP vs GDPR — Key differences for B2B SaaS products serving Swiss and EU markets simultaneously',
    descStatic:'Technical and legal comparison: jurisdiction primacy, data subject rights, breach notification deadlines, profiling rules, adequacy decisions, and how to architect a single SaaS that satisfies both frameworks without duplicating compliance infrastructure.'
  },
  {
    n:'#07', featured:false,
    tags:['MVP','Timeline','Cost','Founders'],
    langTag:'PT · EN', langTagCls:'',
    readMin:9,
    titleKey:'art07Title', descKey:'art07Desc'
  },
  {
    n:'#08', featured:false,
    tags:['AI','RAG','OpenAI','Product'],
    langTag:'PT · EN', langTagCls:'',
    readMin:11,
    titleKey:'art08Title', descKey:'art08Desc'
  },
  {
    n:'#09', featured:false,
    tags:['Stripe','Subscriptions','SaaS','Revenue'],
    langTag:'PT · EN', langTagCls:'',
    readMin:13,
    titleKey:'art09Title', descKey:'art09Desc'
  },
  {
    n:'#10', featured:false,
    tags:['Next.js','Vercel','Performance','SEO'],
    langTag:'PT · EN', langTagCls:'',
    readMin:10,
    titleKey:'art10Title', descKey:'art10Desc'
  }
];

/* ── DOM HELPERS ─────────────────────────────────────────────────────── */
function $(id) { return document.getElementById(id); }
function setText(id, val, html) {
  var el = $(id);
  if (!el || val === undefined || val === null) return;
  if (html) { el.innerHTML = val; } else { el.textContent = val; }
}

/* ── ARTICLE GRID RENDERER ───────────────────────────────────────────── */
/**
 * Destroys and rebuilds the entire topics-grid innerHTML.
 * Called on every locale change. ~10-25ms DOM reflow cost — acceptable trade-off
 * for absolute translation parity.
 * @param {string} loc      — resolved locale string (e.g. 'de-CH')
 * @param {object} d        — blog i18n section for this locale
 */
function renderBlogGrid(loc, d) {
  var grid = $('topics-grid');
  if (!grid) return;

  var readLabel = d.readLabel || '⏱ ~';   /* fallback prefix */
  var readSuffix = d.readSuffix || ' min';

  var html = '';
  for (var i = 0; i < ARTICLES.length; i++) {
    var a = ARTICLES[i];

    /* Resolve title and description */
    var title = a.titleStatic || (d[a.titleKey] || '');
    var desc  = a.descStatic  || (d[a.descKey]  || '');

    /* Build tag chips */
    var tagsHtml = '';
    for (var j = 0; j < a.tags.length; j++) {
      tagsHtml += '<span class="topic-tag">' + a.tags[j] + '</span>';
    }
    /* Lang tag */
    tagsHtml += '<span class="topic-tag ' + a.langTagCls + '">' + a.langTag + '</span>';

    html +=
      '<article class="topic-card' + (a.featured ? ' featured' : '') + '">' +
        '<span class="topic-n">' + a.n + '</span>' +
        '<div class="topic-tags">' + tagsHtml + '</div>' +
        '<h2 class="topic-title">' + escHtml(title) + '</h2>' +
        '<p class="topic-desc">' + escHtml(desc) + '</p>' +
        '<div class="topic-meta">' +
          '<span class="topic-read">' + readLabel + a.readMin + readSuffix + '</span>' +
          '<span class="topic-wip">' + escHtml(d.wip || '') + '</span>' +
        '</div>' +
      '</article>';
  }
  grid.innerHTML = html;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── DECLARATIVE data-i18n PARSER ───────────────────────────────────── */
/**
 * Resolves all [data-i18n="section:key"] attributes in the current DOM.
 * Format: "section:key"  — section is 'blog' or 'global'.
 * Called after id-based setText calls so it acts as a catch-all.
 * @param {string} loc — active locale
 */
function applyDataI18n(loc) {
  var dict = window.VC_I18N && window.VC_I18N[loc];
  if (!dict) return;
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var raw = el.getAttribute('data-i18n');
    if (!raw) return;
    var parts   = raw.split(':');
    var section = parts[0];
    var key     = parts[1];
    if (!section || !key) return;
    var sec = dict[section];
    if (!sec) return;
    var val = sec[key];
    if (val === undefined || val === null) return;
    /* Use innerHTML for keys that contain HTML (e.g. blog:title with <br/>) */
    if (el.hasAttribute('data-i18n-html') || key === 'title') {
      el.innerHTML = val;
    } else {
      el.textContent = val;
    }
  });
}

/* ── PRIMARY APPLY FUNCTION ──────────────────────────────────────────── */
/**
 * Full reactive re-render of blog.html for the given locale.
 * Called on boot (FCP) and on every lang-picker interaction.
 * @param {string} locale
 */
function applyBlogLocale(locale) {
  var loc = (window.VC_I18N && window.VC_I18N[locale]) ? locale : 'de-CH';
  var d   = window.VC_I18N[loc].blog;
  var g   = window.VC_I18N[loc].global;

  /* 1. Update <html lang=""> */
  document.documentElement.lang = window.VC_I18N[loc].htmlLang;

  /* 2. Lang-picker UI state */
  var langCur = $('bh-lang-current');
  if (langCur) langCur.textContent = g.langLabel;
  document.querySelectorAll('.lang-opt').forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-locale') === loc);
  });

  /* 3. Header back-link */
  setText('bh-back', g.backPortfolio);

  /* 4. Hero section */
  setText('blog-eyebrow', d.eyebrow);
  setText('blog-title', d.title, true);  /* innerHTML — may contain <br/> */
  setText('blog-sub', d.sub);

  /* 5. Topics label */
  setText('topics-label', d.topicsLabel);

  /* 6. Article grid — full destroy + rebuild (guaranteed translation parity) */
  renderBlogGrid(loc, d);

  /* 7. Coming-soon banner */
  setText('cs-title', d.csTitle);
  setText('cs-desc', d.csDesc);
  var csCta = $('cs-cta');
  if (csCta && d.csCta) {
    csCta.textContent = d.csCta;
    csCta.href = 'mailto:edumonteiro.dev@gmail.com?subject=' + d.mailSubject + '&body=' + d.mailBody;
  }

  /* 8. Footer */
  setText('ft-privacy', g.ftPrivacy);
  setText('ft-terms',   g.ftTerms);
  setText('ft-cookies', g.ftCookies);

  /* 9. Declarative data-i18n sweep — catch-all for any remaining tagged elements */
  applyDataI18n(loc);
}

/* ── EXPOSE as VC_APPLY so VC_SET() in i18n.js calls this function ──── */
window.VC_APPLY = applyBlogLocale;

/* ── LANG DROPDOWN EVENT LISTENERS ──────────────────────────────────── */
(function () {
  var btn      = $('bh-lang-btn');
  var dropdown = $('lang-dropdown');
  if (!btn || !dropdown) return;

  /* Toggle open/close */
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    var isOpen = dropdown.classList.toggle('open');
    btn.classList.toggle('open', isOpen);
    btn.setAttribute('aria-expanded', String(isOpen));
  });

  /* Close on outside click */
  document.addEventListener('click', function () {
    dropdown.classList.remove('open');
    btn.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
  });

  /* Prevent close when clicking inside dropdown */
  dropdown.addEventListener('click', function (e) { e.stopPropagation(); });

  /* Lang option click:
   * 1. Persist to localStorage via VC_SET (also calls VC_APPLY → applyBlogLocale)
   * 2. Explicit direct call to applyBlogLocale as redundant safety net
   *    in case VC_APPLY reference was not yet established when VC_SET fires. */
  document.querySelectorAll('.lang-opt').forEach(function (opt) {
    opt.addEventListener('click', function () {
      var newLocale = opt.getAttribute('data-locale');

      /* Close dropdown */
      dropdown.classList.remove('open');
      btn.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');

      /* Persist state */
      window.VC_SET(newLocale);

      /* Explicit re-render — guaranteed even if VC_APPLY hook was stale */
      applyBlogLocale(newLocale);
    });
  });
}());

/* ── BOOT — FCP (synchronous, zero flash) ────────────────────────────── */
applyBlogLocale(window.VC_LOCALE || 'de-CH');

/* ── PWA ─────────────────────────────────────────────────────────────── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {});
  });
}
</script>
</body>
